name: Compile openra1n ipad6
on: [push]
jobs:
  linux-build:
    strategy:
      matrix:
        arch:
          - runner: ubuntu-22.04
            name: x86_64
          - runner: ubuntu-22.04-arm
            name: aarch64

    name: linux-${{ matrix.arch.name }}
    runs-on: ${{ matrix.arch.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Install depends
        run: |
          sudo apt update
          sudo apt install -y build-essential libusb-1.0-0-dev

      - name: Run make
        run: make openra1n LIBUSB=1

      - name: Zip openra1n
        run: zip -r openra1n-ipad6_linux-${{ matrix.arch.name }}.zip openra1n

      - name: Update latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest \
            openra1n-ipad6_linux-${{ matrix.arch.name }}.zip \
            --clobber -R ${{ github.repository }}

          gh release edit latest \
            --title "Latest" \
            --target ${{ github.sha }} -R ${{ github.repository }}
